name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: unit and in-process cluster tests (race detector)
        run: go test -race -count=1 ./...
      - name: process-level end-to-end test
        run: SHC_E2E=1 go test -count=1 -v ./test/e2e/
      - name: fuzz the frame decoder
        run: go test -run='^$' -fuzz=FuzzReadFrame -fuzztime=20s ./internal/protocol/

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t self-healing-cache:ci .
      - name: compose smoke test
        run: |
          docker compose up -d
          for p in 8001 8002 8003; do
            for i in $(seq 1 60); do curl -fs localhost:$p/readyz && break; sleep 1; done
          done
          curl -fs -X PUT localhost:8001/v1/kv/ci -d ok
          curl -fs localhost:8003/v1/kv/ci | grep '"value": "ok"'
      - name: logs on failure
        if: failure()
        run: docker compose logs
      - name: tear down
        if: always()
        run: docker compose down
